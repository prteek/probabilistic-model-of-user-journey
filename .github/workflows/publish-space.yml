name: Publish Space

on:
  push:
    branches: [main]
    paths:
      - space/**
      - user_journey/model.py
      - publish.sh
      - wait_for_space.py
      - .github/workflows/publish-space.yml
  workflow_dispatch:

concurrency:
  group: publish-space
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_CLI: hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the app's dependencies and the hf CLI
        run: pip install -r space/requirements.txt gradio==6.30.0 pytest huggingface_hub==2.3.0
      - name: Test the model and the app
        run: python -m pytest -q
      - name: Upload to the Space
        run: ./publish.sh "Deploy ${GITHUB_SHA::7} from GitHub" space
      - name: Wait until the Space runs the new commit
        run: python wait_for_space.py prteek/user-journey-what-if
